[workspace]
resolver = "2"
members = [
    #"crates/integrity",
    "crates/alt_coordinator",
    "crates/shared_ownership_integrity",
    "crates/shared_ownership_coordinator",
]

[workspace.package]
version = "0.1.0"
rust-version = "1.75.0"
edition = "2021"

[workspace.lints.rust]
non_upper_case_globals = "allow"
unused_doc_comments = "allow"
non_camel_case_types = "allow"
non_snake_case = "allow"
unused_attributes = "allow"

[workspace.dependencies]
serde = { version = "=1.0.203", default-features = false }
hdi = { version = "=0.6.2", default-features = false }
hdk = { version = "=0.5.2", default-features = false }
zome_utils = { git = "https://github.com/ddd-mtl/zome-utils", branch = "hdk-5.0" }
zome_signals = { git = "https://github.com/ddd-mtl/zome-signals", branch = "hdk-5.0" }

[profile.dev]
lto = false
opt-level = 0
overflow-checks = false

[profile.release]
opt-level = "z"
#lto = true
lto = false
